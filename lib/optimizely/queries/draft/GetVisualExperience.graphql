query VisualBuilder($locales: [Locales], $key: String, $version: String) {
  SEOExperience(
    locale: $locales
    # `variation` is required to render A/B-test variations in preview: Graph
    # excludes variation content unless asked for it, so a variation's version
    # otherwise returns an empty composition (blank preview).
    variation: { include: ALL, includeOriginal: true }
    # Match key AND version (both in one _metadata object). The previous
    # `key` _or `version` matched key-only or version-only, which -- combined
    # with `item` -- could return the wrong variation/version.
    where: { _metadata: { key: { eq: $key }, version: { eq: $version } } }
  ) {
    item {
      composition {
        nodes {
          nodeType
          key
          displaySettings {
            value
            key
          }
          ... on CompositionComponentNode {
            component {
              ...ItemsInContentArea
            }
          }
          ... on CompositionStructureNode {
            key
            rows: nodes {
              ... on CompositionStructureNode {
                key
                columns: nodes {
                  ... on CompositionStructureNode {
                    key
                    elements: nodes {
                      key
                      displaySettings {
                        value
                        key
                      }
                      ... on CompositionComponentNode {
                        component {
                          ...ItemsInContentArea
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
      _metadata {
        key
        version
      }
    }
  }
}
