query getPreviewBlogPostByURL(
  $locales: [Locales]
  $urlSuffix: String
  $version: String
) {
  BlogPost(
    locale: $locales
    where: {
      _metadata: { version: { eq: $version } }
      _and: { _metadata: { url: { default: { endsWith: $urlSuffix } } } }
    }
  ) {
    total
    item {
      title
      subheading
      author
      publishedDate
      body {
        html
        json
      }
      _modified
    }
  }
}
