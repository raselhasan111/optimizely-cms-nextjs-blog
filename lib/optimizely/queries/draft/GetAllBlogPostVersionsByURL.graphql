query GetAllBlogPostVersionsByURL($locales: [Locales], $urlSuffix: String) {
  BlogPost(
    locale: $locales
    where: { _metadata: { url: { default: { endsWith: $urlSuffix } } } }
  ) {
    items {
      _metadata {
        version
      }
      title
      subheading
      author
      publishedDate
      body {
        html
        json
      }
      _modified
    }
  }
}
